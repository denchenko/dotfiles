set -sg escape-time 0

set -g history-limit 10000

# move between panes
#―――――――――――――――――――――――――――――
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
bind P paste-buffer

bind-key s run "tmux new-window 'zsh -ci fs'"
bind-key p run "tmux split-window -l 12 'zsh -ci ftpane'"
bind-key f run -b ftwind

set -g status-justify left
set -g status-bg "colour236"
set -g status-fg "colour14"

setw -g mode-keys vi

setw -g clock-mode-colour "colour14"

set -g status-left-length 32
setw -g status-left " #S "

set -g status-right-length "100"
# 24 hour time: `%H:%M`
# 12 hour time: `%-I:%M %p`
set -g status-right "#[bg=colour239]#[fg=white] %a %B %-d, %Y #[fg=colour14].:. #[fg=white]%H:%M #[fg=black,bg=colour14] #h "

setw -g window-status-format " #I: #W "
# separator symbols: ┃ ║ │ ❮  ❯ ╲ ╱ left bar: ⎸ right bar: ⎹
setw -g window-status-separator ""

set-window-option -g window-status-current-style fg=black,bg=colour14

set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g renumber-windows on
set-option -g set-titles on
set -g set-titles-string '#{pane_current_path} #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
